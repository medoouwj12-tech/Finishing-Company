<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تسجيل الدخول — ULTIMATE FITOUT ERP</title><link rel="stylesheet" href="/static/app.css"><style>body{min-height:100vh;background:radial-gradient(circle at 15% 15%,#2c5277,#0e2034 62%);display:grid;place-items:center}.login-card{width:min(420px,calc(100% - 32px));background:#fff;border:1px solid #ffffff44;border-radius:18px;padding:36px;box-shadow:0 28px 90px #06152888}.login-brand{display:flex;align-items:center;gap:13px;margin-bottom:32px}.login-brand .brand-mark{width:48px;height:48px}.login-brand strong{font-size:14px}.login-card h1{font-size:23px;margin:0 0 5px}.login-card p{font-size:12px;color:#8593a3;margin:0 0 25px}.login-card label{display:block;font-size:11px;color:#52657a;margin:15px 0}.login-card input{width:100%;height:44px;border:1px solid #e1e7ed;border-radius:8px;margin-top:7px;padding:0 12px;direction:ltr;text-align:left}.login-card button{width:100%;height:43px;margin-top:10px}.login-error{color:#b54747!important;background:#fff0f0;border-radius:7px;padding:10px;display:none}.login-error.show{display:block}</style></head><body><form id="login" class="login-card"><div class="login-brand"><div class="brand-mark">UF</div><div><strong>ULTIMATE FITOUT</strong><small>نظام إدارة التشطيبات</small></div></div><h1>مرحبًا بعودتك</h1><p>سجّل الدخول لإدارة مساحة عمل شركتك.</p><p id="error" class="login-error"></p><label>البريد الإلكتروني<input name="email" type="email" autocomplete="username" required></label><label>كلمة المرور<input name="password" type="password" autocomplete="current-password" required></label><button class="primary">تسجيل الدخول</button></form><script>document.querySelector('#login').addEventListener('submit',async e=>{e.preventDefault();const b=e.currentTarget.querySelector('button');b.disabled=true;const error=document.querySelector('#error');try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.currentTarget)))});const d=await r.json();if(!r.ok)throw Error(d.error||'تعذر تسجيل الدخول');location.href='/workspace.html'}catch(x){error.textContent=x.message;error.classList.add('show')}finally{b.disabled=false}});</script></body></html>
